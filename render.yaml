# Render Blueprint for the API (docs/DEPLOY.md). Starter web service in Frankfurt, next to the Neon database in
# AWS Europe Central 1 (Frankfurt): the closest region to Nigeria either host offers. The move from the old Ohio
# setup is step by step in docs/LAUNCH.md (project root), "Moving to Frankfurt".
# Deploys are triggered by GitHub Actions after CI passes and migrations have run, so autoDeploy is off.
services:
  - type: web
    name: forum-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      # Pooled Neon URL (host contains "-pooler") for the app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      # Inline jobs keep Neon free to scale to zero. Trending and daily stats still refresh: their readers recompute
      # stale snapshots (docs/DEPLOY.md, "Jobs"). Set to true to run them on a schedule instead.
      - key: JOBS_ENABLED
        value: "false"
      - key: RATE_LIMIT_STORE
        value: postgres
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: INDEXNOW_KEY
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: ADSENSE_ENABLED
        value: "false"
