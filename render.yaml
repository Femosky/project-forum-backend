# Render Blueprint for the API (docs/DEPLOY.md). Starter web service in Frankfurt, next to the Neon database in
# AWS Europe Central 1 (Frankfurt): the closest region to Nigeria either host offers. The move from the old Ohio
# setup is step by step in docs/LAUNCH.md (project root), "Moving to Frankfurt".
# Deploys are triggered by GitHub Actions after CI passes and migrations have run, so autoDeploy is off.
services:
  - type: web
    name: forum-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      # Pooled Neon URL (host contains "-pooler") for the app
      - key: DATABASE_URL
        sync: false
      # Direct Neon URL (no "-pooler") for the job queue; without it the queue shares the pooled URL
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_URL
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      # The job queue runs while the site is in use and stops after 5 minutes without requests (health checks don't
      # count), so Neon can suspend and stay inside the free plan's 100 compute hours (docs/DEPLOY.md, "Jobs")
      - key: JOBS_ENABLED
        value: "true"
      - key: JOBS_IDLE_SUSPEND_MINUTES
        value: "5"
      - key: RATE_LIMIT_STORE
        value: postgres
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: API_URL
        value: https://api.forum.oskeylabs.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: INDEXNOW_KEY
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      # Automatic content checks (OpenAI moderation, free). Empty: nothing is checked automatically
      - key: OPENAI_API_KEY
        sync: false
      - key: ADSENSE_ENABLED
        value: "false"
      # Image uploads (Cloudflare R2); docs/LAUNCH.md at the project root, Part 13
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
